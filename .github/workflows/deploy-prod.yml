# prod 迁移 + 部署（M7.5-8，规则见 docs/tech-stack.md 10.2）
# main 有 push：有新迁移 → 建 Neon 快照 → 迁移 → 部署；没有新迁移 → 直接部署
# Secrets（只放 GitHub 仓库 Secrets）：NEON_API_KEY、NEON_PROJECT_ID、DATABASE_URL_PROD、VERCEL_DEPLOY_HOOK_URL
# 不要开 Actions 的 debug 日志（ACTIONS_STEP_DEBUG）：会把 create-branch-action 的输出（含快照 branch 的连接串）打出来

name: deploy-prod

on:
  push:
    branches: [main]

# 两次 push 不同时跑迁移；后来的排队，不取消正在跑的
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 要拿到 push 之前的 commit 做 diff

      # 1. 这次 push 有没有新的 drizzle/*.sql
      - name: 检查新迁移
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # 第一次 push 或强推，找不到之前的 commit：按有迁移处理，宁可多建一个快照
            echo "找不到 push 之前的 commit，按有新迁移处理"
            echo "has_migration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- 'drizzle/*.sql')
          if [ -n "$files" ]; then
            echo "新迁移："
            echo "$files"
            echo "has_migration=true" >> "$GITHUB_OUTPUT"
          else
            echo "没有新迁移，直接部署"
            echo "has_migration=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 快照名
        id: name
        if: steps.detect.outputs.has_migration == 'true'
        run: |
          echo "branch=pre-migrate-$(TZ=Australia/Melbourne date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 2. 从 prod 建快照（Data and schema：branch_type 默认 default，不是 schema-only）
      #    不用这个 action 的输出（里面有连接串）
      - name: 建 Neon 快照
        if: steps.detect.outputs.has_migration == 'true'
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: production
          branch_name: ${{ steps.name.outputs.branch }}

      # 3. 迁移 prod，失败就停，后面不部署
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.has_migration == 'true'
        # 版本读 package.json 的 packageManager

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.has_migration == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 迁移 prod
        if: steps.detect.outputs.has_migration == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_PROD 没有设置"
            exit 1
          fi
          case "$DATABASE_URL" in
            *-pooler*)
              echo "::error::DATABASE_URL_PROD 是 pooled 连接串，迁移要用直连串（主机名不带 -pooler）"
              exit 1
              ;;
          esac
          pnpm install --frozen-lockfile
          pnpm db:migrate

      # 4. 部署（vercel.json 已关掉 git 自动部署，只靠这个 hook）
      - name: 触发 Vercel 部署
        id: deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL 没有设置"
            exit 1
          fi
          curl -fsS -X POST -o /dev/null "$HOOK"
          echo "已触发部署，进度在 Vercel 控制台看"

      # 5. 只留最近 3 个 pre-migrate-* 快照。失败只出警告，不影响已经完成的部署
      - name: 清理旧快照
        if: always() && steps.detect.outcome == 'success'
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          KEEP: 3
        run: |
          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches"
          auth="Authorization: Bearer ${NEON_API_KEY}"
          old=$(curl -fsS -H "$auth" -H "Accept: application/json" "$api" \
            | jq -r --argjson keep "$KEEP" '
                [.branches[] | select(.name | startswith("pre-migrate-"))]
                | sort_by(.created_at) | reverse | .[$keep:] | .[] | "\(.id) \(.name)"')
          if [ -z "$old" ]; then
            echo "pre-migrate-* 不超过 ${KEEP} 个，不用删"
            exit 0
          fi
          while read -r id name; do
            echo "删除 ${name}"
            curl -fsS -X DELETE -H "$auth" -o /dev/null "${api}/${id}"
          done <<< "$old"
